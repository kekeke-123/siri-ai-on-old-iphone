name: apply-kernel-patch

# The maintenance agent cannot push with git credentials; it can only write
# plain files through its GitHub connector. Multi-line source changes therefore
# land as a unified diff and are applied here, on the runner, where a real
# GITHUB_TOKEN exists.
#
# Contract: drop patches/0004-kernel-qwen35.patch plus a .kernel-patch-pending
# marker in a commit. This job applies, commits and removes the marker.

on:
  push:
    paths:
      - ".kernel-patch-pending"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'kekeke-123/siri-ai-on-old-iphone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending patches
        run: |
          set -euo pipefail
          applied=0
          for p in patches/0004-*.patch; do
            [ -e "$p" ] || continue
            echo "== applying $p"
            git apply --whitespace=nowarn "$p"
            rm -f "$p"
            applied=$((applied + 1))
          done
          rm -f .kernel-patch-pending
          echo "applied=$applied"
          if [ "$applied" -eq 0 ]; then
            echo "nothing to apply"
            exit 0
          fi
          git add -A
          git -c user.name='spk-bot' -c user.email='spk-bot@users.noreply.github.com' \
              commit -m "kernel: qwen35 arch, qwen sampler defaults, chatml fallback, selftest"
          git push origin HEAD:main
