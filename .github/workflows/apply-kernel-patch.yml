name: apply-kernel-patch

# The maintenance agent cannot push with git credentials; it can only write
# plain files through its GitHub connector. Multi-line source changes land as
# unified diffs and are applied here, where a real GITHUB_TOKEN exists.
#
# Contract: drop patches/0004-*.patch plus a .kernel-patch-pending marker.
# A patch that does not apply is moved to patches/failed/ and reported in
# CI_PATCH.md instead of aborting the whole batch - one bad hunk must not block
# the good ones again.

on:
  push:
    paths:
      - ".kernel-patch-pending"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'kekeke-123/siri-ai-on-old-iphone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending patches
        shell: bash
        run: |
          set -uo pipefail
          ok=0
          bad=""
          mkdir -p patches/failed
          for p in patches/0004-*.patch; do
            [ -e "$p" ] || continue
            echo "== applying $p"
            if git apply --whitespace=nowarn "$p"; then
              rm -f "$p"
              ok=$((ok + 1))
            else
              echo "FAILED $p"
              bad="$bad$p`n"
              mv "$p" "patches/failed/" || rm -f "$p"
            fi
          done
          rm -f .kernel-patch-pending
          echo "applied=$ok"
          if [ "$ok" -eq 0 ]; then
            echo "nothing applied"
          fi
          {
            echo "# patch apply report"
            echo "run: $GITHUB_RUN_ID @ $GITHUB_SHA"
            echo "applied: $ok"
            if [ -n "$bad" ]; then
              echo "failed:"
              echo "```"
              echo "$bad"
              echo "```"
            fi
          } > CI_PATCH.md
          git add -A
          git -c user.name='spk-bot' -c user.email='spk-bot@users.noreply.github.com' \
              commit -m "kernel: apply pending patches ($ok ok)" || echo "nothing to commit"
          git push origin HEAD:main || echo "push skipped"
