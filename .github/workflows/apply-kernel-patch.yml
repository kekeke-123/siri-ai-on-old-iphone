name: apply-kernel-patch

# The maintenance agent cannot push with git credentials; it can only write
# plain files through its GitHub connector. Multi-line source changes therefore
# land as a unified diff and are applied here, on the runner, where a real
# GITHUB_TOKEN exists.
#
# Contract: drop patches/*.patch plus a .kernel-patch-pending marker in a
# [skip ci] commit (paths-ignored by build.yml, so it costs no build). The cron
# below picks it up, applies, commits and removes the marker.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'kekeke-123/siri-ai-on-old-iphone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bail out when nothing is pending
        id: pending
        run: |
          if [ -f .kernel-patch-pending ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending patches
        if: steps.pending.outputs.go == 'yes'
        run: |
          set -euo pipefail
          shopt -s nullglob
          applied=0
          for p in patches/000*.patch; do
            echo "== applying $p"
            git apply --whitespace=nowarn "$p"
            rm -f "$p"
            applied=$((applied + 1))
          done
          rm -f .kernel-patch-pending
          echo "applied=$applied"
          if [ "$applied" -eq 0 ]; then
            echo "nothing to apply"
            exit 0
          fi
          git add -A
          git -c user.name='spk-bot' -c user.email='spk-bot@users.noreply.github.com' \
              commit -m "kernel: qwen35 arch support, qwen sampler defaults, chatml fallback, headless selftest"
          git push origin HEAD:main
