name: import-sources

# One-shot: pulls the packaged sources, verifies the hash, commits them and
# then kicks off the iOS build. Deletes itself in the same commit.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-sources.yml'

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch payload
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/src.tgz \
            'https://aka.doubaocdn.com/s/AE2Ptwxmus'
          echo 'a84055d2efb8e2de35ab5e0f06f5170404e9d6cbf81b56050ac559e232797e9c  /tmp/src.tgz' | sha256sum -c -
          ls -l /tmp/src.tgz

      - name: Extract
        run: |
          set -euo pipefail
          tar xzf /tmp/src.tgz -C .
          rm -f .github/workflows/import-sources.yml
          git status --short | head -50

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'spk-import'
          git config user.email 'spk-import@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Siri Plus kernel, app, scripts, patches and CI'
          git push origin HEAD:main

      - name: Start the iOS build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main || true
