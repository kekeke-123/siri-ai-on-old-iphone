name: import-sources

# One-shot importer with on-repo diagnostics.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-sources.yml'

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and extract
        id: fetch
        continue-on-error: true
        run: |
          set -x
          URL='https://aka.doubaocdn.com/s/aE2Ptwxmus'
          {
            echo "runner: $(uname -a)"
            echo "curl: $(curl --version | head -1)"
            curl -L --fail --retry 3 --retry-delay 2 -o /tmp/src.tgz "$URL" && echo 'curl: ok'
            ls -l /tmp/src.tgz && sha256sum /tmp/src.tgz
            echo 'a84055d2efb8e2de35ab5e0f06f5170404e9d6cbf81b56050ac559e232797e9c  /tmp/src.tgz' | sha256sum -c - && echo 'hash: ok'
            mkdir -p /tmp/out && tar xzf /tmp/src.tgz -C /tmp/out && echo 'tar: ok'
            find /tmp/out -type f | wc -l
          } > /tmp/log.txt 2>&1
          echo '--- log ---'; cat /tmp/log.txt

      - name: Publish diagnostics
        if: always()
        run: |
          {
            echo '# import diagnostics'
            echo "outcome: ${{ steps.fetch.outcome }}"
            echo '```'
            cat /tmp/log.txt 2>/dev/null || echo 'no log produced'
            echo '```'
          } > IMPORT_LOG.md
          git config user.name  'spk-import'
          git config user.email 'spk-import@users.noreply.github.com'
          git add IMPORT_LOG.md
          git commit -m 'ci: import diagnostics' || true
          git push origin HEAD:main
