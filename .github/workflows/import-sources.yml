name: import-sources

# One-shot: pulls the source archive, verifies the digest, expands it and
# starts the iOS build. Only touches source paths (no workflow files).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-sources.yml'

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify
        run: |
          set -euo pipefail
          curl -sSL -X POST -o /tmp/src.tgz 'https://temp.sh/KvcHr/spk3.tgz'
          ls -l /tmp/src.tgz
          echo 'a346f262e623ea1ab6a28fec5720ab3ed3d93f906035649dff5d82406a1e8c81  /tmp/src.tgz' | sha256sum -c -

      - name: Expand
        run: |
          set -euo pipefail
          tar xzf /tmp/src.tgz -C .
          rm -rf import IMPORT_LOG.md
          git status --short | wc -l

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'spk-import'
          git config user.email 'spk-import@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Siri Plus kernel, app, scripts and patches'
          git push origin HEAD:main

      - name: Start the iOS build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main || true
