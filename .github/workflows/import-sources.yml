name: import-sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-sources.yml'

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe fetch
        id: probe
        continue-on-error: true
        run: |
          {
            URL='https://temp.sh/tugNU/spk-src.tgz'
            echo "== POST $URL"
            curl -sS -L -X POST -D /tmp/hdr -o /tmp/src.tgz "$URL" || echo "curl exit $?"
            echo '== response headers'; cat /tmp/hdr 2>/dev/null | head -25
            echo '== size'; ls -l /tmp/src.tgz 2>/dev/null
            echo '== digest'; sha256sum /tmp/src.tgz 2>/dev/null
            echo '== first bytes'; head -c 120 /tmp/src.tgz 2>/dev/null | od -c | head -4
            echo '== tar entries'; tar tzf /tmp/src.tgz 2>/dev/null | head -6
          } > /tmp/log.txt 2>&1
          cat /tmp/log.txt

      - name: Publish log
        if: always()
        run: |
          {
            echo '# probe';
            echo "outcome: ${{ steps.probe.outcome }}";
            echo '```';
            cat /tmp/log.txt 2>/dev/null || echo none;
            echo '```';
          } > IMPORT_LOG.md
          git config user.name 'spk-import'
          git config user.email 'spk-import@users.noreply.github.com'
          git add IMPORT_LOG.md
          git commit -m 'ci: probe log' || true
          git push origin HEAD:main || true
