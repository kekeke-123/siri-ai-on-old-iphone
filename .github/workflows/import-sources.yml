name: import-sources

# Decodes the base64 payload committed under import/, verifies it byte for byte,
# expands the sources, then starts the iOS build. Removes itself.
on:
  workflow_dispatch:
  push:
    paths:
      - 'import/READY'

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and decode
        run: |
          set -euo pipefail
          sha256sum -c import/MANIFEST
          cat import/p-*.b64 | base64 -d > /tmp/src.tgz
          expected=$(cat import/HASH)
          actual=$(sha256sum /tmp/src.tgz | cut -d' ' -f1)
          echo "expected=$expected"
          echo "actual=$actual"
          [ "$expected" = "$actual" ]
          ls -l /tmp/src.tgz

      - name: Expand
        run: |
          set -euo pipefail
          tar xzf /tmp/src.tgz -C .
          rm -rf import
          rm -f .github/workflows/import-sources.yml
          find . -path ./.git -prune -o -type f -print | sort | head -60

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  'spk-import'
          git config user.email 'spk-import@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Siri Plus kernel, app, scripts, patches and CI'
          git push origin HEAD:main || true

      - name: Start the iOS build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main || true
