name: import-sources

# One-shot: grabs the packaged sources over a plain HTTPS POST, verifies the
# digest, expands them and starts the iOS build. Removes itself afterwards.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-sources.yml'

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 3 --retry-delay 2 -X POST \
            -o /tmp/src.tgz 'https://temp.sh/tugNU/spk-src.tgz'
          ls -l /tmp/src.tgz
          echo 'a84055d2efb8e2de35ab5e0f06f5170404e9d6cbf81b56050ac559e232797e9c  /tmp/src.tgz' | sha256sum -c -

      - name: Expand
        run: |
          set -euo pipefail
          tar xzf /tmp/src.tgz -C .
          rm -rf import IMPORT_LOG.md
          rm -f .github/workflows/import-sources.yml
          git status --short | head -60

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  'spk-import'
          git config user.email 'spk-import@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Siri Plus kernel, app, scripts, patches and CI'
          git push origin HEAD:main

      - name: Start the iOS build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main || true
