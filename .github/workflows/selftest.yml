name: selftest

# Proves on real weights that the kernel loads, prefills, decodes and
# snapshots - including the hybrid qwen35 path. Kept out of build.yml so a
# release build never waits on a multi-GB download it does not need.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "weights to run (comma separated: 0.8b, 0.5b, 2b)"
        default: "0.8b,0.5b"
  push:
    branches: [ main ]
    paths:
      - "kernel/**"
      - "scripts/kernel-selftest.sh"
      - "scripts/fetch-runtime.sh"
      - ".github/workflows/selftest.yml"
  pull_request:
    paths:
      - "kernel/**"

jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kernel selftest
        env:
          SPK_SELFTEST_MODELS: ${{ github.event.inputs.models || '0.8b,0.5b' }}
          SPK_SELFTEST_TOKENS: "24"
        run: |
          set -o pipefail
          bash ./scripts/kernel-selftest.sh 2>&1 | tee selftest.log
