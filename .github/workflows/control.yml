name: control

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'control/**'
      - '.github/workflows/control.yml'

permissions:
  contents: write

env:
  CI_LOG: ${{ github.workspace }}/build/ci.log

jobs:
  ipa:
    name: control ipa
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p build
          brew install xcodegen 2>&1 | tee -a "$CI_LOG"

      - name: Generate project
        run: |
          cd control
          xcodegen generate 2>&1 | tee -a "$CI_LOG"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project control/Control.xcodeproj \
            -scheme Control \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ControlData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a "$CI_LOG"

      - name: Package
        run: |
          mkdir -p build/control-out/Payload
          cp -R build/ControlData/Build/Products/Release-iphoneos/Control.app build/control-out/Payload/
          cd build/control-out
          zip -qry Control-unsigned.ipa Payload
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: Control-unsigned-ipa
          path: build/control-out/Control-unsigned.ipa
          if-no-files-found: error

      - name: Publish
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-control
          name: Control unsigned ipa
          body: Plain SwiftUI control build, no kernel, no widget.
          prerelease: true
          files: build/control-out/Control-unsigned.ipa

      - name: Publish failure log
        if: failure()
        run: |
          {
            echo "# control failure";
            echo "run: ${{ github.run_id }} @ ${{ github.sha }}";
            echo; echo '```';
            tail -n 200 build/ci.log 2>/dev/null || echo 'no log';
            echo '```';
          } > /tmp/fail-control.md
          git fetch --depth 10 origin main
          git reset --hard origin/main
          cp /tmp/fail-control.md CI_LOG.md
          git add -f CI_LOG.md
          git -c user.name='spk-ci' -c user.email='spk-ci@users.noreply.github.com' commit -m "ci: control failure log ${{ github.run_id }}"
          git push origin HEAD:main || true
