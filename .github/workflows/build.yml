name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CI_LOG: ${{ github.workspace }}/build/ci.log

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          set -o pipefail
          mkdir -p build
          { xcodebuild -version; brew install xcodegen; } 2>&1 | tee -a "$CI_LOG"

      - name: Fetch runtime and apply kernel patches
        run: |
          set -o pipefail
          bash ./scripts/fetch-runtime.sh 2>&1 | tee -a "$CI_LOG"

      - name: Kernel syntax gate
        run: |
          set -o pipefail
          clang++ -std=c++17 -fsyntax-only \
            -I kernel/include -I kernel/include/spk -I kernel/src \
            -I third_party/runtime/include \
            -I third_party/runtime/ggml/include \
            -I third_party/runtime/tools/mtmd \
            kernel/src/*.cpp 2>&1 | tee -a "$CI_LOG"

      - name: Build kernel for iOS arm64
        run: |
          set -o pipefail
          bash ./scripts/build-ios.sh 2>&1 | tee -a "$CI_LOG"

      - name: Generate vendor xcconfig
        run: |
          set -o pipefail
          bash ./scripts/gen-xcconfig.sh 2>&1 | tee -a "$CI_LOG"

      - name: Generate Xcode project
        run: |
          set -o pipefail
          cd app
          xcodegen generate 2>&1 | tee -a "$CI_LOG"

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project app/SiriAI.xcodeproj \
            -scheme SiriAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a "$CI_LOG"

      - name: Package IPA
        run: |
          set -o pipefail
          bash ./scripts/package-ipa.sh 2>&1 | tee -a "$CI_LOG"

      - uses: actions/upload-artifact@v4
        with:
          name: SiriAI-unsigned-ipa
          path: build/out/SiriAI-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/SiriAI-unsigned.ipa

      - name: Publish failure log
        if: failure()
        run: |
          {
            echo "# build failure";
            echo "run: ${{ github.run_id }} @ ${{ github.sha }}";
            echo; echo '```';
            tail -n 400 build/ci.log 2>/dev/null || echo 'no log';
            echo '```';
          } > /tmp/fail.md
          for i in 1 2 3; do
            git fetch --depth 10 origin main
            git reset --hard origin/main
            cp /tmp/fail.md CI_LOG.md
            git add -f CI_LOG.md
            git -c user.name='spk-ci' -c user.email='spk-ci@users.noreply.github.com' commit -m "ci: failure log ${{ github.run_id }}"
            if git push origin HEAD:main; then break; fi
            sleep 5
          done
