name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CI_LOG: ${{ github.workspace }}/build/ci.log

jobs:
  ipa:
    # Two flavors, because all three bundled models would push a single .ipa past
    # the 2 GB per-asset limit on GitHub Releases.
    name: ipa (${{ matrix.flavor }})
    runs-on: macos-15-intel
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        flavor: [ full, compat ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          set -o pipefail
          mkdir -p build
          { xcodebuild -version; brew install xcodegen; } 2>&1 | tee -a "$CI_LOG"

      - name: Fetch runtime and apply kernel patches
        run: |
          set -o pipefail
          bash ./scripts/fetch-runtime.sh 2>&1 | tee -a "$CI_LOG"

      - name: Fetch bundled weights (${{ matrix.flavor }})
        env:
          SPK_MODEL_SET: ${{ matrix.flavor }}
        run: |
          set -o pipefail
          bash ./scripts/fetch-model.sh 2>&1 | tee -a "$CI_LOG"

      - name: Kernel syntax gate
        run: |
          set -o pipefail
          clang++ -std=c++17 -fsyntax-only \
            -I kernel/include -I kernel/include/spk -I kernel/src \
            -I third_party/runtime/include \
            -I third_party/runtime/ggml/include \
            -I third_party/runtime/tools/mtmd \
            kernel/src/*.cpp 2>&1 | tee -a "$CI_LOG"

      - name: Build kernel for iOS arm64
        run: |
          set -o pipefail
          bash ./scripts/build-ios.sh 2>&1 | tee -a "$CI_LOG"

      - name: Generate vendor xcconfig
        run: |
          set -o pipefail
          bash ./scripts/gen-xcconfig.sh 2>&1 | tee -a "$CI_LOG"

      - name: Generate Xcode project
        run: |
          set -o pipefail
          cd app
          xcodegen generate 2>&1 | tee -a "$CI_LOG"

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project app/SiriAI.xcodeproj \
            -scheme SiriAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a "$CI_LOG"

      - name: Package IPA
        run: |
          set -o pipefail
          bash ./scripts/package-ipa.sh 2>&1 | tee -a "$CI_LOG"

      - name: Name the artifact per flavor
        run: |
          mv build/out/SiriAI-unsigned.ipa "build/out/SiriAI-unsigned-${{ matrix.flavor }}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: SiriAI-unsigned-ipa-${{ matrix.flavor }}
          path: build/out/SiriAI-unsigned-${{ matrix.flavor }}.ipa
          if-no-files-found: error

      - name: Publish unsigned IPA to rolling release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.flavor == 'full' && 'latest-build' || 'latest-build-lite' }}
          name: SiriAI unsigned .ipa (${{ matrix.flavor }})
          body: |
            Automated unsigned build, no signing at all.
            flavor: ${{ matrix.flavor }} (full = Qwen3.5-2B + 0.8B, compat = 0.8B + Qwen2.5-0.5B)
            run ${{ github.run_id }} @ ${{ github.sha }}
          prerelease: true
          files: build/out/SiriAI-unsigned-${{ matrix.flavor }}.ipa

      - name: Publish failure log
        if: failure() && matrix.flavor == 'full'
        run: |
          {
            echo "# build failure";
            echo "run: ${{ github.run_id }} @ ${{ github.sha }}";
            echo; echo '```';
            tail -n 400 build/ci.log 2>/dev/null || echo 'no log';
            echo '```';
          } > /tmp/fail.md
          for i in 1 2 3; do
            git fetch --depth 10 origin main
            git reset --hard origin/main
            cp /tmp/fail.md CI_LOG.md
            git add -f CI_LOG.md
            git -c user.name='spk-ci' -c user.email='spk-ci@users.noreply.github.com' commit -m "ci: failure log ${{ github.run_id }}"
            if git push origin HEAD:main; then break; fi
            sleep 5
          done
