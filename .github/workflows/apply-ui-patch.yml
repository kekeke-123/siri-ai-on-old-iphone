name: apply-ui-patch

# Applies a small patch to the app repository. The patch is produced locally
# with git diff and served from an object CDN, so the runner applies a real
# unified diff instead of trusting hand-copied file bodies.

on:
  push:
    paths:
      - '.github/workflows/apply-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch patch
        run: |
          set -euo pipefail
          mkdir -p fixes
          curl -fsSL --retry 3 -o fixes/current.patch https://aka.doubaocdn.com/s/RSQCIMpfxs
          wc -l fixes/current.patch

      - name: Verify
        run: |
          set -euo pipefail
          git apply --check --whitespace=nowarn fixes/current.patch
          echo 'patch applies cleanly'

      - name: Apply
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn fixes/current.patch
          rm -rf fixes
          git status --short

      - name: Sanity gate
        run: |
          set -euo pipefail
          grep -q 'runs-on: macos-15' .github/workflows/build-lean.yml
          grep -q 'Kernel 1.1.0' .github/workflows/build-lean.yml
          test ! -e app/Sources/OrbView.swift
          grep -q 'Text("LLAI")' app/Sources/AssistantView.swift

      - name: Commit
        run: |
          set -euo pipefail
          git add -A
          git -c user.name='llai-bot' -c user.email='llai-bot@users.noreply.github.com' \
            commit -m 'ci: move the iOS build to the macOS 15 runner' \
            || echo 'nothing to commit'

      - name: Push with rebase retry
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "attempt $i rejected, rebasing"
            git fetch origin main
            git rebase origin/main || git rebase --abort || true
            sleep 2
          done
          echo 'push failed after retries'
          exit 1
